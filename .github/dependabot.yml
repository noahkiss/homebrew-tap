version: 2

# Every action in the bump workflows is pinned to a full commit SHA with the
# version in a trailing comment, matching the policy in noahkiss/workflows.
# Dependabot handles that format natively — it rewrites the SHA and the
# comment together — so no extra configuration is needed here. Keep the
# comment when reviewing a bump: it is what makes the hash diff readable.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: actions
    groups:
      actions:
        patterns:
          - "*"
