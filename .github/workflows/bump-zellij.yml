name: Bump zellij-nkmk

# Bumps the zellij formulae to a fork release:
#
#   gh workflow run bump-zellij.yml -R noahkiss/homebrew-tap -f tag=v0.45.0-nkmk.5
#
# A tag carrying `-rc.` is a release candidate. It bumps `zellij-nkmk-rc` alone —
# the formula a Mac proof agent installs while a patch is being proved — and never
# `zellij-nkmk`, which is what every machine actually runs:
#
#   gh workflow run bump-zellij.yml -R noahkiss/homebrew-tap \
#     -f tag=v0.45.0-nkmk.12-rc.1 -f formula=zellij-nkmk-rc
#
# The `formula` input and the tag have to agree. They are cross-checked, so a
# dispatch that forgets the input fails instead of pointing the stable formula at
# a candidate.
#
# The shas are read from the `.sha256` assets the fork's release workflow already
# publishes, so nothing is transcribed by hand. The rewritten formulae are proved
# by a real `brew install` on both poured platforms before anything is committed.
#
# This runs in the tap, so it commits with the tap's own GITHUB_TOKEN — no
# cross-repo credential is involved. The fork's release workflow fires it
# automatically once it has published the release (job `bump-tap` there, using a
# PAT, since a repo's GITHUB_TOKEN cannot dispatch another repo). Running it by
# hand with the line above still works and is the fallback when no PAT is set.

# `gh workflow run` returns nothing that identifies the run it just started, so
# the caller passes a request_id and finds its run by this name. Keep the id in
# the name or the fork's wait step cannot match it.
run-name: >-
  Bump ${{ inputs.formula || 'zellij-nkmk' }} to ${{ inputs.tag }}${{ inputs.request_id && format(' ({0})', inputs.request_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Fork release tag to bump to, e.g. v0.45.0-nkmk.5'
        required: true
      formula:
        description: 'Which formula this tag owns'
        required: false
        default: 'zellij-nkmk'
        type: choice
        options:
          - zellij-nkmk
          - zellij-nkmk-rc
      request_id:
        description: 'Caller-generated id, echoed in the run name so the dispatcher can find this run'
        required: false

permissions:
  contents: write

env:
  FORK_REPO: noahkiss/zellij

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.rewrite.outputs.version }}
      changed: ${{ steps.rewrite.outputs.changed }}
      formula: ${{ steps.rewrite.outputs.formula }}
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite the formulae
        id: rewrite
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          FORMULA: ${{ inputs.formula || 'zellij-nkmk' }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          # The tag decides which formula it may rewrite; the input only says it
          # out loud. Disagreement is a mistake in the caller, and what it would
          # otherwise cause — the stable formula pointing at a candidate — reaches
          # every machine on the next `brew upgrade`.
          case "$TAG" in
            *-rc.*) expected='zellij-nkmk-rc' ;;
            *)      expected='zellij-nkmk' ;;
          esac
          if [ "$FORMULA" != "$expected" ]; then
            echo "::error::${TAG} belongs to ${expected}, not ${FORMULA}"
            exit 1
          fi
          echo "formula=${FORMULA}" >> "$GITHUB_OUTPUT"

          # Only a final release rebuilds the from-source formula. There is no rc
          # counterpart: a candidate is proved from the poured binary.
          if [ "$FORMULA" = 'zellij-nkmk' ]; then
            source_formula='Formula/zellij-nkmk-source.rb'
          else
            source_formula=''
          fi

          mac_target='aarch64-apple-darwin'
          linux_target='x86_64-unknown-linux-gnu'

          # Every asset must be attached before we point a formula at it. The fork
          # creates its release up front, so a release existing proves nothing.
          for t in "$mac_target" "$linux_target"; do
            for suffix in '' '.sha256'; do
              asset="zellij-nkmk-${version}-${t}.tar.gz${suffix}"
              gh release view "$TAG" -R "$FORK_REPO" --json assets \
                --jq '.assets[].name' | grep -qx "$asset" \
                || { echo "::error::asset not attached to ${TAG}: ${asset}"; exit 1; }
            done
          done

          # The published .sha256 files are the source of truth for the binaries.
          workdir="$(mktemp -d)"
          gh release download "$TAG" -R "$FORK_REPO" -D "$workdir" -p '*.sha256'
          mac_sha="$(awk '{print $1}' "${workdir}/zellij-nkmk-${version}-${mac_target}.tar.gz.sha256")"
          linux_sha="$(awk '{print $1}' "${workdir}/zellij-nkmk-${version}-${linux_target}.tar.gz.sha256")"

          # The source formula pins the auto-generated tag tarball, which has no
          # published sha — hash what GitHub actually serves.
          src_sha=''
          if [ -n "$source_formula" ]; then
            src_sha="$(curl -fsSL "https://github.com/${FORK_REPO}/archive/refs/tags/${TAG}.tar.gz" | sha256sum | awk '{print $1}')"
          fi

          for v in "$mac_sha" "$linux_sha" ${src_sha:+"$src_sha"}; do
            [[ "$v" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::not a sha256: ${v}"; exit 1; }
          done

          old_version="$(sed -n 's/^  version "\(.*\)"$/\1/p' "Formula/${FORMULA}.rb")"
          [ -n "$old_version" ] || { echo "::error::cannot read current version"; exit 1; }

          # Prebuilt formula: the version string carries both asset URLs with it,
          # then each sha is set by the target named in the url line above it.
          old_pattern="$(printf '%s' "$old_version" | sed 's/[][\.^$*/]/\\&/g')"
          sed -i "s|${old_pattern}|${version}|g" "Formula/${FORMULA}.rb"
          awk -v mac="$mac_sha" -v linux="$linux_sha" '
            /url .*aarch64-apple-darwin\.tar\.gz/     { print; want = "mac";   next }
            /url .*x86_64-unknown-linux-gnu\.tar\.gz/ { print; want = "linux"; next }
            /^[[:space:]]*sha256 "/ && want == "mac"   { sub(/"[0-9a-f]*"/, "\"" mac   "\""); want = ""; print; next }
            /^[[:space:]]*sha256 "/ && want == "linux" { sub(/"[0-9a-f]*"/, "\"" linux "\""); want = ""; print; next }
                                                      { print }
          ' "Formula/${FORMULA}.rb" > /tmp/prebuilt.rb
          mv /tmp/prebuilt.rb "Formula/${FORMULA}.rb"

          # Source formula: one url, one sha256.
          if [ -n "$source_formula" ]; then
            sed -i \
              -e "s|^  url \".*\"$|  url \"https://github.com/${FORK_REPO}/archive/refs/tags/${TAG}.tar.gz\"|" \
              -e "s|^  sha256 \".*\"$|  sha256 \"${src_sha}\"|" \
              "$source_formula"
          fi

          # Prove the rewrite landed rather than trusting the patterns.
          grep -qx "  version \"${version}\"" "Formula/${FORMULA}.rb"
          grep -q "${mac_sha}" "Formula/${FORMULA}.rb"
          grep -q "${linux_sha}" "Formula/${FORMULA}.rb"
          if [ -n "$source_formula" ]; then
            grep -q "${src_sha}" "$source_formula"
            grep -q "refs/tags/${TAG}.tar.gz" "$source_formula"
          fi
          if grep -rn "${old_pattern}" "Formula/${FORMULA}.rb" ${source_formula:+"$source_formula"}; then
            echo "::error::the old version ${old_version} survives the rewrite"
            exit 1
          fi
          # A fast syntax failure here beats one inside brew. The install in
          # `verify` is the real parse, and brew re-checks every sha on download.
          if command -v ruby >/dev/null; then
            ruby -c "Formula/${FORMULA}.rb"
            [ -z "$source_formula" ] || ruby -c "$source_formula"
          fi

          if git diff --quiet -- Formula; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Formulae already at ${version}; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- Formula
          fi

      - uses: actions/upload-artifact@v4
        if: steps.rewrite.outputs.changed == 'true'
        with:
          name: formulae
          # All of them, rewritten or not: brew loads every formula a
          # `conflicts_with` names before it will install any of them.
          path: |
            Formula/zellij-nkmk.rb
            Formula/zellij-nkmk-rc.rb
            Formula/zellij-nkmk-source.rb

  # The bump is only as good as an install that actually pours. Both poured
  # platforms are checked; the source formula is not built here, since a full
  # Rust build per run costs more than it proves.
  verify:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: formulae
          path: Formula

      - name: Install and check the poured binary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          FORMULA: ${{ needs.prepare.outputs.formula }}
        run: |
          set -euo pipefail
          # Homebrew is preinstalled on both runner images, but only macOS puts it
          # on PATH for us.
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          command -v brew >/dev/null || { echo "::error::no brew on ${{ matrix.os }}"; exit 1; }

          # Homebrew rejects a formula given as a loose file path — it has to live
          # in a tap. Stage the candidates in the tap directory brew expects, so
          # this installs the rewrite rather than whatever is published.
          tap_dir="$(brew --repository)/Library/Taps/noahkiss/homebrew-tap"
          mkdir -p "${tap_dir}/Formula"
          cp Formula/*.rb "${tap_dir}/Formula/"
          if [ ! -d "${tap_dir}/.git" ]; then
            git -C "$tap_dir" init -q
            git -C "$tap_dir" add -A
            git -C "$tap_dir" -c user.email=ci@local -c user.name=ci commit -qm 'bump candidate'
          fi
          # Newer Homebrew refuses third-party taps until trusted. Every formula
          # loads here, not just the one installed, because each declares a
          # conflicts_with against the others.
          brew trust noahkiss/tap
          brew install "noahkiss/tap/${FORMULA}"
          # The whole version, candidate suffix and all. The fork's release
          # workflow bakes `-rc.N` into the binary, so a candidate that reports
          # the final version is not the build this tag published.
          got="$(zellij --version)"
          echo "$got"
          case "$got" in
            *"$VERSION"*) : ;;
            *) echo "::error::zellij --version says '${got}', expected ${VERSION}"; exit 1 ;;
          esac

  commit:
    needs: [prepare, verify]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: formulae
          path: Formula

      - name: Commit the bump
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          FORMULA: ${{ needs.prepare.outputs.formula }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula
          git diff --cached --quiet && { echo "nothing staged"; exit 0; }
          git commit -m "${FORMULA} ${VERSION}"

          # Another bump landing on main between this job's checkout and its push
          # rejects it. Rebase and retry rather than failing a bump that is
          # otherwise complete and already verified.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::push failed after ${attempt} attempts"
              exit 1
            fi
            echo "push raced with main; rebasing before retry $((attempt + 1))/5"
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 5))
          done
