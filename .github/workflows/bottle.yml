name: Bottle formula

# Publishes a formula whose source repository is private as a source archive
# plus bottles on this tap's own release, so any machine installs it with no
# credential of its own:
#
#   gh workflow run bottle.yml -R noahkiss/homebrew-tap -f formula=basic-memory -f tag=v0.1.17
#
# `basic-memory` is the only formula this serves, and several steps assume it:
# the source repository, the deploy-key secret, the `git archive` layout and
# the uv build that the bottles capture. The `formula` input exists so the
# run-name and a future second formula follow the bump.yml shape; making the
# rest generic is not free, so it is hardcoded here and the input is a
# one-option choice.
#
# Three jobs:
#
# 1. `source` checks the tag out with a read-only deploy key (tap Actions
#    secret BASIC_MEMORY_DEPLOY_KEY), uploads a `git archive` tarball to the
#    tap release `<formula>-<version>`, and rewrites the formula's url and
#    sha256 to point at it. It commits nothing.
# 2. `bottle` builds the rewritten formula with `--build-bottle` on each
#    matrix runner, runs its `test do` block, and bottles it.
# 3. `publish` uploads the bottles to the same release, merges their JSON into
#    a `bottle do` block, and commits the formula. A failed build or test in
#    any matrix leg commits nothing.
#
# The release is reused when it exists. An existing source tarball is never
# replaced: it is downloaded and hashed instead, because a committed formula
# may already pin its sha256. Bottles are replaced on every run; only this
# run's commit names their hashes.

# `gh workflow run` returns nothing that identifies the run it just started, so
# a caller passes a request_id and finds its run by this name. Keep the id in
# the name or a dispatcher's wait step cannot match it.
run-name: >-
  Bottle ${{ inputs.formula }} ${{ inputs.tag }}${{ inputs.request_id && format(' ({0})', inputs.request_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      formula:
        description: 'Formula to bottle (Formula/<name>.rb)'
        required: true
        default: 'basic-memory'
        type: choice
        options:
          - basic-memory
      tag:
        description: "Source repository's release tag, e.g. v0.1.17"
        required: true
      request_id:
        description: 'Caller-generated id, echoed in the run name so the dispatcher can find this run'
        required: false

permissions:
  contents: write

# Two runs for one formula would race on the release assets and the commit.
concurrency:
  group: bottle-${{ inputs.formula }}
  cancel-in-progress: false

env:
  SOURCE_REPO: noahkiss/basic-memory

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - name: Validate inputs
        id: meta
        env:
          TAG: ${{ inputs.tag }}
          FORMULA: ${{ inputs.formula }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]] \
            || { echo "::error::not a release tag: ${TAG}"; exit 1; }
          version="${TAG#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release=${FORMULA}-${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tap

      # The deploy key is read-only and scoped to the source repository alone.
      # Its private half is also kept in the owner's password manager.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.tag }}
          ssh-key: ${{ secrets.BASIC_MEMORY_DEPLOY_KEY }}
          path: src
          persist-credentials: false

      - name: Publish the source archive
        id: archive
        env:
          GH_TOKEN: ${{ github.token }}
          FORMULA: ${{ inputs.formula }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          RELEASE: ${{ steps.meta.outputs.release }}
        run: |
          set -euo pipefail
          name="${FORMULA}-${VERSION}.tar.gz"
          work="$(mktemp -d)"

          if ! gh release view "$RELEASE" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "${FORMULA} ${VERSION}" \
              --notes "Source archive and bottles for ${FORMULA} ${VERSION}, built from ${SOURCE_REPO} ${TAG}."
          fi

          if gh release view "$RELEASE" -R "$GITHUB_REPOSITORY" --json assets \
               --jq '.assets[].name' | grep -qxF "$name"; then
            echo "${name} already on ${RELEASE}; hashing the published copy"
            gh release download "$RELEASE" -R "$GITHUB_REPOSITORY" -p "$name" -D "$work"
          else
            git -C src archive --format=tar.gz --prefix="${FORMULA}-${VERSION}/" \
              -o "${work}/${name}" HEAD
            gh release upload "$RELEASE" -R "$GITHUB_REPOSITORY" "${work}/${name}"
          fi

          sha="$(sha256sum "${work}/${name}" | awk '{print $1}')"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::not a sha256: ${sha}"; exit 1; }
          echo "url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE}/${name}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha}" >> "$GITHUB_OUTPUT"

      - name: Rewrite the formula
        env:
          FILE: tap/Formula/${{ inputs.formula }}.rb
          URL: ${{ steps.archive.outputs.url }}
          SHA256: ${{ steps.archive.outputs.sha256 }}
        run: |
          set -euo pipefail
          # The url stanza is either the old git form (url + tag: + revision:)
          # or a url + sha256 pair. The previous version's bottle block goes;
          # `publish` writes this version's.
          python3 - <<'PY'
          import os, re, sys
          path, url, sha = os.environ["FILE"], os.environ["URL"], os.environ["SHA256"]
          s = open(path).read()
          s = re.sub(r"^  bottle do\n(?:    .*\n)+  end\n\n", "", s, flags=re.M)
          s, n = re.subn(
              r'^  url "[^"]*"(?:,\n +\w+: +"[^"]*")*\n(?:  sha256 "[0-9a-f]{64}"\n)?',
              f'  url "{url}"\n  sha256 "{sha}"\n', s, flags=re.M)
          if n != 1:
              sys.exit(f"::error::expected one url stanza in {path}, found {n}")
          open(path, "w").write(s)
          PY

          grep -qxF "  url \"${URL}\"" "$FILE"
          grep -qxF "  sha256 \"${SHA256}\"" "$FILE"
          if grep -nE 'ssh://|revision:|^  bottle do' "$FILE"; then
            echo "::error::the old url stanza or bottle block survives the rewrite"
            exit 1
          fi
          ruby -c "$FILE"
          git -C tap diff -- Formula

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formulae
          # The whole directory, as in bump.yml: brew loads every formula a
          # `conflicts_with` names before it installs any of them.
          path: tap/Formula/

  bottle:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        # macos-26 is the newest GA macOS label. macOS 27 has no `macos-27`
        # label yet; its only hosted image is the `xcode-27` preview, which
        # runs macOS 27.0. Swap it for `macos-27` once that label ships.
        # os: [macos-26, macos-27, ubuntu-latest]
        os: [macos-26, xcode-27, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # An auto-update would pull the published tap over the staged formula.
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: formulae
          path: Formula

      - name: Build, test and bottle
        env:
          FORMULA: ${{ inputs.formula }}
          ROOT_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.source.outputs.release }}
        run: |
          set -euo pipefail
          # Homebrew is preinstalled on every image, but only macOS puts it on PATH.
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          command -v brew >/dev/null || { echo "::error::no brew on ${{ matrix.os }}"; exit 1; }
          brew --version
          sw_vers 2>/dev/null || true

          brew tap noahkiss/tap
          # Newer Homebrew refuses third-party taps until trusted.
          brew trust noahkiss/tap
          tap_dir="$(brew --repository noahkiss/tap)"
          cp Formula/*.rb "${tap_dir}/Formula/"
          brew readall noahkiss/tap

          brew install --build-bottle "noahkiss/tap/${FORMULA}"
          brew test "noahkiss/tap/${FORMULA}"

          mkdir -p bottles
          cd bottles
          brew bottle --json --no-rebuild --root-url "$ROOT_URL" "noahkiss/tap/${FORMULA}"

          # brew bottle writes `<name>--<version>.<tag>.bottle.tar.gz`, but the
          # url it records, and the one brew downloads, uses the single-dash
          # `filename` from the JSON. Rename to that. The OS tag comes from the
          # JSON too, never from this matrix.
          shopt -s nullglob
          jsons=(*.bottle.json)
          [ "${#jsons[@]}" -eq 1 ] || { echo "::error::expected one bottle JSON, found ${#jsons[@]}"; exit 1; }
          jq -r '.[].bottle.tags | to_entries[] | "\(.key) \(.value.local_filename) \(.value.filename)"' \
            "${jsons[0]}" | while read -r tag local remote; do
            echo "bottle tag ${tag}: ${local} -> ${remote}"
            [ -f "$local" ] || { echo "::error::missing ${local}"; exit 1; }
            [ "$local" = "$remote" ] || mv "$local" "$remote"
          done
          ls -l

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottle-${{ matrix.os }}
          path: bottles/
          if-no-files-found: error

  publish:
    needs: [source, bottle]
    runs-on: ubuntu-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: formulae
          path: Formula

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bottle-*
          path: bottles
          merge-multiple: true

      - name: Upload bottles and write the bottle block
        env:
          GH_TOKEN: ${{ github.token }}
          FORMULA: ${{ inputs.formula }}
          RELEASE: ${{ needs.source.outputs.release }}
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          ls -l bottles
          gh release upload "$RELEASE" -R "$GITHUB_REPOSITORY" --clobber bottles/*.bottle.tar.gz

          # `brew bottle --merge --write` edits the formula inside the tap
          # directory brew knows, so stage the rewrite there, merge, and copy
          # the result back to this checkout.
          brew tap noahkiss/tap
          brew trust noahkiss/tap
          tap_dir="$(brew --repository noahkiss/tap)"
          cp "Formula/${FORMULA}.rb" "${tap_dir}/Formula/"
          brew bottle --merge --write --no-commit bottles/*.bottle.json
          cp "${tap_dir}/Formula/${FORMULA}.rb" "Formula/${FORMULA}.rb"
          brew readall noahkiss/tap
          git diff -- "Formula/${FORMULA}.rb"

      - name: Commit the formula
        env:
          FORMULA: ${{ inputs.formula }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "Formula/${FORMULA}.rb"
          git diff --cached --quiet && { echo "nothing staged"; exit 0; }
          git commit -m "${FORMULA} ${VERSION}: source archive and bottles on the tap release" \
            -- "Formula/${FORMULA}.rb"

          # A bump landing on main between checkout and push rejects it. Rebase
          # and retry rather than fail a build that is already verified.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::push failed after ${attempt} attempts"
              exit 1
            fi
            echo "push raced with main; rebasing before retry $((attempt + 1))/5"
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 5))
          done
