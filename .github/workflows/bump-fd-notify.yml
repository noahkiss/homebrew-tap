name: Bump fd-notify

# Builds fd-notify at an nkmk-push tag and bumps Formula/fd-notify.rb to it:
#
#   gh workflow run bump-fd-notify.yml -R noahkiss/homebrew-tap -f tag=v0.3.2
#
# fd-notify's source repository (noahkiss/nkmk-push) is private, so Homebrew
# cannot download from it. Like bottle.yml, this workflow checks the tag out
# with a read-only deploy key (tap Actions secret NKMK_PUSH_DEPLOY_KEY; its
# private half is also in the owner's password manager), cross-compiles the
# three binaries, and publishes each tarball with its .sha256 on this tap's
# own release `fd-notify-<version>`. nkmk-push's release workflow dispatches
# this (job `bump-tap` there, with a PAT) and passes only the tag.
#
# Jobs:
# 1. `build` publishes the tarballs. It fails when a binary contains a
#    MagicDNS name or a Tailscale address: the release is public, so no
#    tailnet host may be compiled in. An asset
#    already on the release is kept, never replaced, because a committed
#    formula may pin its sha256.
# 2. `prepare` rewrites the formula from the published .sha256 files.
# 3. `verify` proves it with `brew readall`, `brew install` and `brew test`
#    on both poured platforms.
# 4. `commit` commits with the tap's own GITHUB_TOKEN. A failed job commits
#    nothing.

# The caller finds its run by this name; keep the request_id in it.
run-name: >-
  Bump fd-notify to ${{ inputs.tag }}${{ inputs.request_id && format(' ({0})', inputs.request_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'nkmk-push tag to build, e.g. v0.3.2'
        required: true
      request_id:
        description: 'Caller-generated id, echoed in the run name so the dispatcher can find this run'
        required: false

permissions:
  contents: write

env:
  FORMULA: Formula/fd-notify.rb
  SOURCE_REPO: noahkiss/nkmk-push
  TARGETS: aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Read the tag
        id: meta
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release tag: ${TAG}"; exit 1; }
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # The deploy key is read-only and scoped to the source repository alone.
      # Only this workflow_dispatch workflow uses it (no pull_request trigger),
      # and it checks out the one tag, never a branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: refs/tags/${{ inputs.tag }}
          ssh-key: ${{ secrets.NKMK_PUSH_DEPLOY_KEY }}
          path: src
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache: false

      - name: Build and publish the tarballs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          rel="fd-notify-${VERSION}"
          dist="$(mktemp -d)"
          stage="$(mktemp -d)"
          # Pure Go: CGO off cross-compiles every target from here.
          for target in $TARGETS; do
            case "$target" in
              aarch64-apple-darwin)      goos=darwin goarch=arm64 ;;
              x86_64-unknown-linux-gnu)  goos=linux  goarch=amd64 ;;
              aarch64-unknown-linux-gnu) goos=linux  goarch=arm64 ;;
            esac
            rm -f "${stage}/fd-notify"
            (cd src && CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" -o "${stage}/fd-notify" ./cmd/fd-notify)
            name="fd-notify-${VERSION}-${target}.tar.gz"
            tar -C "$stage" -czf "${dist}/${name}" fd-notify
            (cd "$dist" && sha256sum "$name" > "${name}.sha256")
          done
          # This tap is public, so the binaries are too: nothing private may be
          # compiled in. The relay URL comes from env or config at run time.
          # Generic patterns only: a MagicDNS name, or a Tailscale address
          # (100.64.0.0/10). Never name a real host or tailnet here.
          private='\.ts\.net|(^|[^0-9])100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}'
          for f in "$dist"/*.tar.gz; do
            tar -xzf "$f" -C "$stage"
            if grep -aqE "$private" "${stage}/fd-notify"; then
              echo "::error::$(basename "$f") contains a tailnet host name or address"; exit 1
            fi
          done
          # The linux amd64 binary runs here; it must report the tag's version.
          tar -xzf "${dist}/fd-notify-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" -C "$stage"
          [ "$("${stage}/fd-notify" version)" = "fd-notify ${VERSION}" ] \
            || { echo "::error::the built binary does not report ${VERSION}"; exit 1; }

          if ! gh release view "$rel" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$rel" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "fd-notify ${VERSION}" \
              --notes "Prebuilt fd-notify ${VERSION} for Formula/fd-notify.rb, built from ${SOURCE_REPO} v${VERSION}."
          fi
          published="$(gh release view "$rel" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for f in "$dist"/*; do
            name="$(basename "$f")"
            if grep -qxF "$name" <<<"$published"; then
              echo "${name} already on ${rel}; keeping the published copy"
            else
              gh release upload "$rel" -R "$GITHUB_REPOSITORY" "$f"
            fi
          done

  prepare:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.rewrite.outputs.version }}
      changed: ${{ steps.rewrite.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rewrite the formula
        id: rewrite
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          rel="fd-notify-${version}"
          targets="$TARGETS"

          # Every asset must be attached before the formula points at it.
          assets="$(gh release view "$rel" --json assets --jq '.assets[].name')"
          for t in $targets; do
            for suffix in '' '.sha256'; do
              asset="fd-notify-${version}-${t}.tar.gz${suffix}"
              grep -qx "$asset" <<<"$assets" || { echo "::error::asset not attached to ${rel}: ${asset}"; exit 1; }
            done
          done

          workdir="$(mktemp -d)"
          gh release download "$rel" -D "$workdir" -p '*.sha256'
          declare -A sha
          for t in $targets; do
            sha[$t]="$(awk '{print $1}' "${workdir}/fd-notify-${version}-${t}.tar.gz.sha256")"
            [[ "${sha[$t]}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::not a sha256 for ${t}"; exit 1; }
          done

          # The version lives in the urls (Homebrew scans it from them).
          old_version="$(sed -n 's|.*/download/fd-notify-\([0-9.]*\)/.*|\1|p' "$FORMULA" | head -1)"
          [ -n "$old_version" ] || { echo "::error::cannot read current version"; exit 1; }
          old_pattern="$(printf '%s' "$old_version" | sed 's/[][\.^$*/]/\\&/g')"
          sed -i "s|${old_pattern}|${version}|g" "$FORMULA"
          # Each sha follows the url line that names its tarball.
          awk -v mac="${sha[aarch64-apple-darwin]}" -v lx="${sha[x86_64-unknown-linux-gnu]}" -v la="${sha[aarch64-unknown-linux-gnu]}" '
            /url .*aarch64-apple-darwin\.tar\.gz/      { print; want = mac; next }
            /url .*x86_64-unknown-linux-gnu\.tar\.gz/  { print; want = lx;  next }
            /url .*aarch64-unknown-linux-gnu\.tar\.gz/ { print; want = la;  next }
            /^[[:space:]]*sha256 "/ && want != ""      { sub(/"[0-9a-f]*"/, "\"" want "\""); want = ""; print; next }
                                                       { print }
          ' "$FORMULA" > /tmp/fd-notify.rb
          mv /tmp/fd-notify.rb "$FORMULA"

          # Prove the rewrite landed rather than trusting the patterns.
          for t in $targets; do
            grep -q "${sha[$t]}" "$FORMULA"
            grep -q "download/${rel}/fd-notify-${version}-${t}.tar.gz" "$FORMULA"
          done
          if [ "$old_version" != "$version" ] && grep -n "${old_pattern}" "$FORMULA"; then
            echo "::error::the old version ${old_version} survives the rewrite"
            exit 1
          fi
          if command -v ruby >/dev/null; then ruby -c "$FORMULA"; fi

          if git diff --quiet -- Formula; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Formula already at ${version}; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- Formula
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.rewrite.outputs.changed == 'true'
        with:
          name: formula
          path: Formula/fd-notify.rb

  verify:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The whole tap, so `brew readall` loads every formula and cask.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: formula
          path: Formula

      - name: Install and check the poured binary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          command -v brew >/dev/null || { echo "::error::no brew on ${{ matrix.os }}"; exit 1; }
          # Homebrew rejects a formula given as a loose file path; stage the tap
          # with the candidate where brew expects it.
          tap_dir="$(brew --repository)/Library/Taps/noahkiss/homebrew-tap"
          mkdir -p "$tap_dir"
          cp -R Formula "$tap_dir/"
          [ -d Casks ] && cp -R Casks "$tap_dir/"
          if [ ! -d "${tap_dir}/.git" ]; then
            git -C "$tap_dir" init -q
            git -C "$tap_dir" add -A
            git -C "$tap_dir" -c user.email=ci@local -c user.name=ci commit -qm 'bump candidate'
          fi
          brew trust noahkiss/tap
          brew readall noahkiss/tap
          brew install noahkiss/tap/fd-notify
          brew test noahkiss/tap/fd-notify
          got="$(fd-notify version)"
          echo "$got"
          [ "$got" = "fd-notify ${VERSION}" ] || { echo "::error::fd-notify version says '${got}', expected ${VERSION}"; exit 1; }

  commit:
    needs: [prepare, verify]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: formula
          path: Formula

      - name: Commit the bump
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula
          git diff --cached --quiet && { echo "nothing staged"; exit 0; }
          git commit -m "fd-notify ${VERSION}"
          # Rebase and retry when another bump lands on main first.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::push failed after ${attempt} attempts"
              exit 1
            fi
            echo "push raced with main; rebasing before retry $((attempt + 1))/5"
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 5))
          done
